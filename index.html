<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background: blue;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid #cf1010;
        }


        main {
            background: #FFFFFF;
            color: #183C63;
            text-align: left;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid #cf1010;
            padding: 16px;
            display: flex;
        }


        img {
            width: 80px;
            height: 80px;
        }


        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>


<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação </p>
    </header>


    <main>
        <img src="imagem-blog.png"
            alt="Logotipo conceitual de tecnologia e educacação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
        <div>
            <h2>Primeiro Post</h2>
            <p class="artigo-autor">Por: Jairo</p>
            <p>Boas-vindas ao meu blog! Aqui vou compartilhar dicas de programação e curiosidades da area de tecnologia.
            </p>
            <button>❤️<span>0</span></button>
        </div>
    </main>


    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);


        function botaoClicado() {
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>


</body>


</html>
